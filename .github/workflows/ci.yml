
name: Predictive Controller CI/CD

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/phuleshi/predictive-controller
  GITOPS_REPO: phuleshi/exam-platform-gitops

jobs:
  # Stage 1: Build & Push Docker Image
  build_dev:
    name: Build & Push Predictive Controller
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage 2: Update GitOps Repository
  update_config_dev:
    name: Update GitOps Config Repository
    needs: [build_dev]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      - name: Update Predictive Controller Image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_SHA="${{ needs.build_dev.outputs.short_sha }}"
          IMAGE="${{ env.IMAGE_NAME }}:${SHORT_SHA}"

          sed -i "s|image: .*|image: ${IMAGE}|g" predictive-controller.yaml

          git add predictive-controller.yaml

          if ! git diff-index --quiet HEAD; then
            git commit -m "Update predictive-controller image to ${SHORT_SHA}"
            git push
          else
            echo "No changes to commit"
          fi
